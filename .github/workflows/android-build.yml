name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fix_bug
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android SDK root
        run: |
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Android SDK command-line tools and platforms
        run: |
          # download command-line tools
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties for SDK location
        run: |
          echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Print environment info
        run: |
          echo "=== Java version ==="
          java -version || true
          echo "=== Gradle version ==="
          chmod +x gradle-8.4/bin/gradle || true
          ./gradle-8.4/bin/gradle -v || true
          echo "=== Disk usage ==="
          df -h || true
          echo "=== Workspace listing ==="
          ls -la || true
          echo "=== app directory ==="
          ls -la app || true
          echo "=== gradle.properties ==="
          cat gradle.properties || true

      - name: Build Debug APK (capture logs)
        run: |
          set -euo pipefail
          # choose gradle command: prefer ./gradlew, then ./gradle-8.4/bin/gradle, then extract gradle-8.4-bin.zip, else install gradle
          gradle_cmd=""
          if [ -x "./gradlew" ]; then
            gradle_cmd="./gradlew"
          elif [ -x "gradle-8.4/bin/gradle" ]; then
            gradle_cmd="./gradle-8.4/bin/gradle"
          elif [ -f "gradle-8.4-bin.zip" ]; then
            echo "Extracting gradle-8.4-bin.zip"
            unzip -q gradle-8.4-bin.zip -d .
            gradle_cmd="./gradle-8.4/bin/gradle"
          else
            echo "No Gradle wrapper or local distribution found; downloading Gradle 8.4 distribution"
            GRADLE_DIST_URL="https://services.gradle.org/distributions/gradle-8.4-bin.zip"
            curl -sSLo gradle-8.4-bin.zip "$GRADLE_DIST_URL"
            unzip -q gradle-8.4-bin.zip -d .
            gradle_cmd="./gradle-8.4/bin/gradle"
          fi

          if [ "$gradle_cmd" != "gradle" ]; then
            chmod +x "$gradle_cmd" || true
          fi

          echo "Using gradle command: $gradle_cmd"
          set -o pipefail
          # Run build and capture output
          $gradle_cmd :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" --stacktrace --info 2>&1 | tee gradle.log
          echo ${PIPESTATUS[0]:-0} > build_exit_code || true
        continue-on-error: true

      - name: Upload Gradle log and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-logs
          path: |
            gradle.log
            build_exit_code
            local.properties
            gradle.properties

      - name: Check for APK
        id: check_apk
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        if: always() && steps.check_apk.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Fail if build failed
        if: always()
        run: |
          if [ -f build_exit_code ]; then
            code=$(cat build_exit_code)
            echo "Build exit code: $code"
            if [ "$code" != "0" ]; then
              echo "Build failed, exiting with code $code"
              exit $code
            fi
          else
            echo "No build_exit_code found, assuming failure"
            exit 1
          fi
